name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore app dependencies
        run: dotnet restore src/SnipText/SnipText.csproj

      - name: Restore test dependencies
        run: dotnet restore tests/SnipText.Tests/SnipText.Tests.csproj

      - name: Build WPF app (Release)
        run: dotnet build src/SnipText/SnipText.csproj -c Release --no-restore

      - name: Run xUnit tests (Release)
        run: dotnet test tests/SnipText.Tests/SnipText.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=sniptext-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/SnipText.Tests/TestResults/**/*.trx
