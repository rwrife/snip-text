name: release-windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-win-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/SnipText/SnipText.csproj

      - name: Publish self-contained win-x64 build
        run: >-
          dotnet publish src/SnipText/SnipText.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o artifacts/publish/win-x64

      - name: Create portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path artifacts/publish/win-x64/* -DestinationPath artifacts/snip-text-win-x64.zip -Force

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: snip-text-win-x64
          path: artifacts/snip-text-win-x64.zip

      - name: Attach zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/snip-text-win-x64.zip
